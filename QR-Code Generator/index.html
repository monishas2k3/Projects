<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Blobs -->
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <!-- Dark Mode -->
    <button id="theme-toggle" class="theme-btn">
        <i class="fa-solid fa-moon"></i>
    </button>

    <!-- Header -->

    <header class="script-header">

        <h1>
            <i class="fa-solid fa-qrcode"></i>
            QR Code Generator
        </h1>

        <p>
            Generate beautiful QR Codes instantly with custom colors and size.
        </p>

    </header>

    <!-- Main -->

    <main class="container">

        <!-- Left Card -->

        <section class="card">

            <h2>Generator Settings</h2>

            <form id="qr-form">

                <div class="form-group">

                    <label for="qr-text">

                        Text or URL

                    </label>

                    <input
                        type="text"
                        id="qr-text"
                        placeholder="https://example.com">

                    <small
                        id="text-error">
                    </small>

                </div>

                <div class="form-group">

                    <label>

                        QR Size

                        <span id="size-value">

                            300px

                        </span>

                    </label>

                    <input
                        type="range"
                        id="qr-size"
                        min="100"
                        max="500"
                        step="10"
                        value="300">

                </div>

                <div class="color-grid">

                    <div>

                        <label>

                            QR Color

                        </label>

                        <input
                            type="color"
                            id="qr-color"
                            value="#000000">

                    </div>

                    <div>

                        <label>

                            Background

                        </label>

                        <input
                            type="color"
                            id="qr-bg-color"
                            value="#ffffff">

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="generate-btn">

                    <i class="fa-solid fa-bolt"></i>

                    Generate QR

                </button>

            </form>

        </section>

        <!-- Right Card -->

        <section class="card preview-card">

            <h2>

                QR Preview

            </h2>

            <div
                class="preview-box"
                id="qr-preview-box">

                <div
                    class="empty-state"
                    id="empty-state">

                    <i class="fa-solid fa-mobile-screen-button"></i>

                    <h3>

                        QR Preview

                    </h3>

                    <p>

                        Your QR Code will scriptear here.

                    </p>

                </div>
                
<!-- Scan Card -->

                <div class="scan-card" id="scan-card" style="display: none;">

                    <h3>

                        📱 SCAN ME

                    </h3>

                    <div id="qr-canvas-container"></div>

                    <p>

                        Scan to open

                    </p>

                </div>

            </div>

                <div
                    id="qr-canvas-container">

                </div>

            </div>
<!-- Download -->

            <div class="download-buttons">

                    <h3 class="download-heading">

                        Download QR

                    </h3>
                <button class="btn btn-success"

                        id="download-png"

                        disabled>

                    <i class="fa-solid fa-file-image"></i>

                    PNG

                </button>

                <button class="btn btn-success"

                        id="download-jpg"

                        disabled>

                    <i class="fa-solid fa-image"></i>

                    JPG

                </button>


            <!-- Extra Buttons -->

            <button

                class="btn btn-copy"

                id="copy-btn"

                disabled>

                <i class="fa-solid fa-copy"></i>

                Copy Text

            </button>

            <button

                class="btn btn-copy"

                id="copy-image-btn"

                disabled>

                <i class="fa-solid fa-clone"></i>

                Copy QR Image

            </button>

            <button

                class="btn btn-primary"

                id="share-btn"

                disabled>

                <i class="fa-solid fa-share-nodes"></i>

                Share QR

            </button>

        </section>

    </main>

    <!-- Toast -->

    <div id="toast">

        Success

    </div>

    <!-- QR Library -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- JS -->

    <script src="script.js"></script>

</body>

</html>
